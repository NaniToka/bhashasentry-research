name: BhashaSentry Automated Daily Benchmark & Audit

on:
  schedule:
    # Runs at 04:00, 06:00, 08:00, 10:00, 12:00, 14:00 UTC daily (Nov 14 to Nov 24, 2026)
    - cron: '0 4,6,8,10,12,14 * 11 *'
  workflow_dispatch:

jobs:
  daily-benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Regression Tests
      run: |
        python scripts/verify_all.py

    - name: Run Full Benchmark Suite
      run: |
        python benchmarks/run_full_evaluation.py

    - name: Log Automated Verification Run
      run: |
        DATE_STAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        echo "{\"timestamp\": \"$DATE_STAMP\", \"status\": \"VERIFIED\", \"tests\": 26}" >> logs/daily_verification.jsonl
        git config user.name "NaniToka"
        git config user.email "tokananiy@gmail.com"
        git add logs/daily_verification.jsonl || true
        git commit -m "chore(audit): automated scheduled benchmark run on $DATE_STAMP [skip ci]" || echo "No changes to commit"
        git push origin main || echo "No push needed"

